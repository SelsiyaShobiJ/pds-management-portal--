<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invalid OTP - Ration Shop Management</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card">
      <a href="login.html" class="back-link">
        <i class="fa-solid fa-arrow-left"></i> Cancel
      </a>

      <h3 class="form-title"><i class="fa-solid fa-triangle-exclamation" style="color:var(--danger-color)"></i> Verification Failed</h3>
      <p class="subtext">The OTP entered is incorrect or expired</p>

      <form action="password-confirm.html" method="GET">
        <div class="otp-container">
          <input type="text" maxlength="1" class="otp-box invalid" value="8">
          <input type="text" maxlength="1" class="otp-box invalid" value="2">
          <input type="text" maxlength="1" class="otp-box invalid" value="1">
          <input type="text" maxlength="1" class="otp-box invalid" value="0">
        </div>

        <p class="error-message"><i class="fa-solid fa-circle-xmark"></i> Invalid OTP code. Please try again.</p>

        <a href="otp-retry.html" class="btn btn-primary btn-full margin-top">Request New OTP Code</a>
      </form>
    </div>
  </div>

  <script src="../js/main.js"></script>
</body>
</html>
