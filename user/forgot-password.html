<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - Ration Shop Management</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card">
      <a href="login.html" class="back-link">
        <i class="fa-solid fa-arrow-left"></i> Back to User Login
      </a>

      <h3 class="form-title"><i class="fa-solid fa-key"></i> Forgot Password</h3>
      <p class="subtext">Enter your registered Mobile Number or Ration Card ID</p>

      <form action="otp-verify.html" method="GET">
        <div class="form-group margin-top">
          <label>Ration Card ID or Mobile Number</label>
          <input type="text" placeholder="e.g. TN-892300192 or 9876543210" required>
        </div>

        <button type="submit" class="btn btn-primary btn-full margin-top">
          Send OTP Verification Code
        </button>
      </form>
    </div>
  </div>

  <script src="../js/main.js"></script>
</body>
</html>
