<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Ration Shop Management</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card">
      <h3 class="form-title"><i class="fa-solid fa-lock"></i> Set New Password</h3>
      <p class="subtext">Create a strong password for your account</p>

      <form action="login.html" method="GET">
        <div class="form-group margin-top">
          <label>New Password</label>
          <input type="password" placeholder="Enter new password" required>
        </div>

        <div class="form-group">
          <label>Confirm New Password</label>
          <input type="password" placeholder="Confirm new password" required>
        </div>

        <button type="submit" class="btn btn-primary btn-full margin-top">
          Update Password & Login
        </button>
      </form>
    </div>
  </div>

  <script src="../js/main.js"></script>
</body>
</html>
