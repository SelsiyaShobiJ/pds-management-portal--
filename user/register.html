<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Registration - Ration Shop Management</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card">
      <a href="login.html" class="back-link">
        <i class="fa-solid fa-arrow-left"></i> Back to Login
      </a>

      <h3 class="form-title"><i class="fa-solid fa-user-plus"></i> New User Registration</h3>
      <p class="subtext">Register your Ration Card for online access</p>

      <form action="otp-verify.html" method="GET">
        <div class="form-group margin-top">
          <label>Ration Card ID</label>
          <input type="text" placeholder="e.g. TN-892300192" required>
        </div>
        <div class="form-group">
          <label>Registered Mobile Number</label>
          <input type="tel" placeholder="+91 98765 43210" required>
        </div>
        <div class="form-group">
          <label>Create Password</label>
          <input type="password" placeholder="Create password" required>
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <input type="password" placeholder="Confirm password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-full margin-top">Proceed to Verification</button>
      </form>
    </div>
  </div>

  <script src="../js/main.js"></script>
</body>
</html>
