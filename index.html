<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ration Shop Management System</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-brand-header">
        <i class="fa-solid fa-store fa-2x brand-icon"></i>
        <h2>Ration Shop Management</h2>
        <p class="subtext">Public Distribution System Portal</p>
      </div>

      <p class="auth-instruction">Please select your portal to continue:</p>
      
      <div class="button-stack">
        <a href="user/login.html" class="btn btn-primary btn-large block-btn">
          <i class="fa-solid fa-user"></i> User Login
        </a>
        <a href="staff/login.html" class="btn btn-secondary btn-large block-btn">
          <i class="fa-solid fa-id-badge"></i> Staff Login
        </a>
      </div>

      <div class="auth-footer-prompt">
        New Beneficiary? <a href="user/register.html">Register Here</a>
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
